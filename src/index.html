<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EroStream - Quad Stream Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 全螢幕滑鼠觸發區 -->
  <div class="fullscreen-trigger-zone" title="移至頂部顯示功能列"></div>

  <!-- 無邊框自訂頂部導航列 (可拖曳視窗) -->
  <header class="titlebar">
    <div class="titlebar-left">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-title">EroStream</span>
        <span class="brand-tag">QUAD LIVE</span>
      </div>

      <div class="status-indicators">
        <span id="slStatus" class="status-badge checking" title="Streamlink 引擎狀態">
          <span class="dot"></span> SL
        </span>
        <span id="vlcStatus" class="status-badge checking" title="VLC 播放核心狀態">
          <span class="dot"></span> VLC
        </span>
      </div>
    </div>

    <div class="titlebar-center">
      <!-- 快捷布局切換 -->
      <div class="layout-toggle-group">
        <button id="layout2x2" class="icon-btn active" title="四分割 (2x2) [雙擊任意畫面亦可全螢幕]">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <rect x="2" y="2" width="5" height="5" rx="1" />
            <rect x="9" y="2" width="5" height="5" rx="1" />
            <rect x="2" y="9" width="5" height="5" rx="1" />
            <rect x="9" y="9" width="5" height="5" rx="1" />
          </svg>
          <span>2x2</span>
        </button>
        <button id="layout1p3" class="icon-btn" title="焦點模式 (1主畫面 + 3副畫面)">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <rect x="2" y="2" width="8" height="12" rx="1" />
            <rect x="11" y="2" width="3" height="3" rx="0.5" />
            <rect x="11" y="6.5" width="3" height="3" rx="0.5" />
            <rect x="11" y="11" width="3" height="3" rx="0.5" />
          </svg>
          <span>1+3</span>
        </button>
      </div>

      <!-- 音訊控制模式 -->
      <div class="audio-mode-selector" title="多台音訊管理模式">
        <button id="audioFocusToggle" class="toggle-pill active" title="滑鼠懸停或點選時自動獨占聲音，其餘自動靜音">
          <span class="pill-icon">🎧</span>
          <span class="pill-text">音訊跟隨焦點</span>
        </button>
        <button id="muteAllBtn" class="toggle-pill" title="全體靜音 (快捷鍵 M)">
          <span class="pill-icon">🔇</span>
          <span class="pill-text">全體靜音</span>
        </button>
      </div>

      <!-- 四分割全域畫質策略 -->
      <div class="preset-controls" title="四分割時建議 720p，雙擊放大會自動升級至 Best 原畫">
        <span style="font-size:11px;color:var(--text-secondary);font-weight:600;">⚡ 預設:</span>
        <select id="gridQualitySelect" class="preset-dropdown">
          <option value="720p" selected>720p (四開流暢)</option>
          <option value="480p">480p (極限省頻寬)</option>
          <option value="best">Best (全原畫)</option>
        </select>
      </div>

      <!-- 預設組合選單 -->
      <div class="preset-controls">
        <select id="presetSelect" class="preset-dropdown">
          <option value="default">預設分組 1</option>
          <option value="preset2">自訂分組 2</option>
          <option value="preset3">自訂分組 3</option>
        </select>
        <button id="savePresetBtn" class="action-btn-sm" title="儲存當前四台網址與音量設定">儲存</button>
        <button id="reloadAllBtn" class="action-btn-sm" title="全體重新連線">🔄 刷新全部</button>
      </div>
    </div>

    <div class="titlebar-right">
      <button id="fullscreenBtn" class="win-btn" title="純淨全螢幕 (隱藏標題列，快捷鍵 F11 / F)">⛶</button>
      <button id="alwaysOnTopBtn" class="win-btn" title="常駐最上層 (快捷鍵 T)">
        <span class="pin-icon">📌</span>
      </button>
      <button id="minBtn" class="win-btn" title="最小化">🗕</button>
      <button id="maxBtn" class="win-btn" title="最大化 / 還原">🗖</button>
      <button id="closeBtn" class="win-btn win-btn-close" title="關閉">✕</button>
    </div>
  </header>

  <!-- 主要四視窗容器 (預設 2x2 Grid) -->
  <main id="playerContainer" class="grid-container mode-2x2">
    <!-- Slot 1 -->
    <div class="stream-slot" id="slot-1" data-slot="1">
      <div class="video-wrapper">
        <video id="video-1" playsinline></video>
        <div class="yt-player-container" id="yt-container-1"></div>
        <div class="audio-active-border"></div>
      </div>
      
      <!-- 未連線 / 設定輸入介面 -->
      <div class="slot-setup" id="setup-1">
        <div class="setup-card">
          <div class="slot-header-num">台 1</div>
          <div class="input-row">
            <input type="text" class="stream-url-input" placeholder="輸入 Twitch / YouTube / Kick 或 m3u8 網址" />
            <button class="btn-play-stream">播放</button>
          </div>
          <div class="quick-samples">
            <span class="sample-chip" data-sample="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">測試源</span>
            <span class="sample-chip clipboard-chip">貼上剪貼簿</span>
          </div>
        </div>
      </div>

      <!-- 讀取狀態 -->
      <div class="slot-loader hidden" id="loader-1">
        <div class="spinner"></div>
        <div class="loader-text">Streamlink 解析中...</div>
      </div>

      <!-- 錯誤狀態 -->
      <div class="slot-error hidden" id="error-1">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">連線失敗</div>
        <div class="error-actions">
          <button class="btn-retry">重試</button>
          <button class="btn-edit-url">修改網址</button>
        </div>
      </div>

      <!-- 頂部浮動資訊列 -->
      <div class="slot-top-bar">
        <div class="slot-badge">台 1</div>
        <div class="stream-title" title="直播名稱">尚未連線</div>
        <select class="quality-select" title="選擇解析度畫質">
          <option value="best">Best (自動最高)</option>
        </select>
        <div class="live-dot" title="LIVE">LIVE</div>
      </div>

      <!-- 底部浮動控制列 -->
      <div class="slot-bottom-bar">
        <button class="ctrl-btn play-pause-btn" title="播放/暫停">⏸</button>
        <button class="ctrl-btn refresh-btn" title="重新連線直播源">🔄</button>
        
        <div class="volume-control-group">
          <button class="ctrl-btn mute-btn" title="靜音/取消靜音">🔊</button>
          <input type="range" class="vol-slider" min="0" max="100" value="80" title="音量" />
        </div>

        <button class="ctrl-btn audio-solo-btn" title="獨占此台音訊 (靜音其他三台)">🎧 獨播音訊</button>
        <button class="ctrl-btn vlc-btn" title="在獨立 VLC 播放器中開啟此台">錐 VLC</button>
        <button class="ctrl-btn edit-btn" title="更換網址">⚙ 換台</button>
        <button class="ctrl-btn solo-btn" title="單一放大全螢幕 (雙擊畫面亦可)">⛶</button>
      </div>
    </div>

    <!-- Slot 2 -->
    <div class="stream-slot" id="slot-2" data-slot="2">
      <div class="video-wrapper">
        <video id="video-2" playsinline></video>
        <div class="yt-player-container" id="yt-container-2"></div>
        <div class="audio-active-border"></div>
      </div>
      
      <div class="slot-setup" id="setup-2">
        <div class="setup-card">
          <div class="slot-header-num">台 2</div>
          <div class="input-row">
            <input type="text" class="stream-url-input" placeholder="輸入 Twitch / YouTube / Kick 或 m3u8 網址" />
            <button class="btn-play-stream">播放</button>
          </div>
          <div class="quick-samples">
            <span class="sample-chip" data-sample="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">測試源</span>
            <span class="sample-chip clipboard-chip">貼上剪貼簿</span>
          </div>
        </div>
      </div>

      <div class="slot-loader hidden" id="loader-2">
        <div class="spinner"></div>
        <div class="loader-text">Streamlink 解析中...</div>
      </div>

      <div class="slot-error hidden" id="error-2">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">連線失敗</div>
        <div class="error-actions">
          <button class="btn-retry">重試</button>
          <button class="btn-edit-url">修改網址</button>
        </div>
      </div>

      <div class="slot-top-bar">
        <div class="slot-badge">台 2</div>
        <div class="stream-title" title="直播名稱">尚未連線</div>
        <select class="quality-select" title="選擇解析度畫質">
          <option value="best">Best (自動最高)</option>
        </select>
        <div class="live-dot" title="LIVE">LIVE</div>
      </div>

      <div class="slot-bottom-bar">
        <button class="ctrl-btn play-pause-btn" title="播放/暫停">⏸</button>
        <button class="ctrl-btn refresh-btn" title="重新連線直播源">🔄</button>
        
        <div class="volume-control-group">
          <button class="ctrl-btn mute-btn" title="靜音/取消靜音">🔊</button>
          <input type="range" class="vol-slider" min="0" max="100" value="80" title="音量" />
        </div>

        <button class="ctrl-btn audio-solo-btn" title="獨占此台音訊 (靜音其他三台)">🎧 獨播音訊</button>
        <button class="ctrl-btn vlc-btn" title="在獨立 VLC 播放器中開啟此台">錐 VLC</button>
        <button class="ctrl-btn edit-btn" title="更換網址">⚙ 換台</button>
        <button class="ctrl-btn solo-btn" title="單一放大全螢幕 (雙擊畫面亦可)">⛶</button>
      </div>
    </div>

    <!-- Slot 3 -->
    <div class="stream-slot" id="slot-3" data-slot="3">
      <div class="video-wrapper">
        <video id="video-3" playsinline></video>
        <div class="yt-player-container" id="yt-container-3"></div>
        <div class="audio-active-border"></div>
      </div>
      
      <div class="slot-setup" id="setup-3">
        <div class="setup-card">
          <div class="slot-header-num">台 3</div>
          <div class="input-row">
            <input type="text" class="stream-url-input" placeholder="輸入 Twitch / YouTube / Kick 或 m3u8 網址" />
            <button class="btn-play-stream">播放</button>
          </div>
          <div class="quick-samples">
            <span class="sample-chip" data-sample="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">測試源</span>
            <span class="sample-chip clipboard-chip">貼上剪貼簿</span>
          </div>
        </div>
      </div>

      <div class="slot-loader hidden" id="loader-3">
        <div class="spinner"></div>
        <div class="loader-text">Streamlink 解析中...</div>
      </div>

      <div class="slot-error hidden" id="error-3">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">連線失敗</div>
        <div class="error-actions">
          <button class="btn-retry">重試</button>
          <button class="btn-edit-url">修改網址</button>
        </div>
      </div>

      <div class="slot-top-bar">
        <div class="slot-badge">台 3</div>
        <div class="stream-title" title="直播名稱">尚未連線</div>
        <select class="quality-select" title="選擇解析度畫質">
          <option value="best">Best (自動最高)</option>
        </select>
        <div class="live-dot" title="LIVE">LIVE</div>
      </div>

      <div class="slot-bottom-bar">
        <button class="ctrl-btn play-pause-btn" title="播放/暫停">⏸</button>
        <button class="ctrl-btn refresh-btn" title="重新連線直播源">🔄</button>
        
        <div class="volume-control-group">
          <button class="ctrl-btn mute-btn" title="靜音/取消靜音">🔊</button>
          <input type="range" class="vol-slider" min="0" max="100" value="80" title="音量" />
        </div>

        <button class="ctrl-btn audio-solo-btn" title="獨占此台音訊 (靜音其他三台)">🎧 獨播音訊</button>
        <button class="ctrl-btn vlc-btn" title="在獨立 VLC 播放器中開啟此台">錐 VLC</button>
        <button class="ctrl-btn edit-btn" title="更換網址">⚙ 換台</button>
        <button class="ctrl-btn solo-btn" title="單一放大全螢幕 (雙擊畫面亦可)">⛶</button>
      </div>
    </div>

    <!-- Slot 4 -->
    <div class="stream-slot" id="slot-4" data-slot="4">
      <div class="video-wrapper">
        <video id="video-4" playsinline></video>
        <div class="yt-player-container" id="yt-container-4"></div>
        <div class="audio-active-border"></div>
      </div>
      
      <div class="slot-setup" id="setup-4">
        <div class="setup-card">
          <div class="slot-header-num">台 4</div>
          <div class="input-row">
            <input type="text" class="stream-url-input" placeholder="輸入 Twitch / YouTube / Kick 或 m3u8 網址" />
            <button class="btn-play-stream">播放</button>
          </div>
          <div class="quick-samples">
            <span class="sample-chip" data-sample="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">測試源</span>
            <span class="sample-chip clipboard-chip">貼上剪貼簿</span>
          </div>
        </div>
      </div>

      <div class="slot-loader hidden" id="loader-4">
        <div class="spinner"></div>
        <div class="loader-text">Streamlink 解析中...</div>
      </div>

      <div class="slot-error hidden" id="error-4">
        <div class="error-icon">⚠️</div>
        <div class="error-msg">連線失敗</div>
        <div class="error-actions">
          <button class="btn-retry">重試</button>
          <button class="btn-edit-url">修改網址</button>
        </div>
      </div>

      <div class="slot-top-bar">
        <div class="slot-badge">台 4</div>
        <div class="stream-title" title="直播名稱">尚未連線</div>
        <select class="quality-select" title="選擇解析度畫質">
          <option value="best">Best (自動最高)</option>
        </select>
        <div class="live-dot" title="LIVE">LIVE</div>
      </div>

      <div class="slot-bottom-bar">
        <button class="ctrl-btn play-pause-btn" title="播放/暫停">⏸</button>
        <button class="ctrl-btn refresh-btn" title="重新連線直播源">🔄</button>
        
        <div class="volume-control-group">
          <button class="ctrl-btn mute-btn" title="靜音/取消靜音">🔊</button>
          <input type="range" class="vol-slider" min="0" max="100" value="80" title="音量" />
        </div>

        <button class="ctrl-btn audio-solo-btn" title="獨占此台音訊 (靜音其他三台)">🎧 獨播音訊</button>
        <button class="ctrl-btn vlc-btn" title="在獨立 VLC 播放器中開啟此台">錐 VLC</button>
        <button class="ctrl-btn edit-btn" title="更換網址">⚙ 換台</button>
        <button class="ctrl-btn solo-btn" title="單一放大全螢幕 (雙擊畫面亦可)">⛶</button>
      </div>
    </div>
  </main>

  <!-- 引用 hls.js 與 mpegts.js 播放函式庫 -->
  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../node_modules/mpegts.js/dist/mpegts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
